[project]
name = "book-recsys"
version = "0.4.0"
description = "Full-stack book recommendation project with chatbot"
requires-python = ">=3.10,<3.11"
dependencies = [
    "aiomysql==0.3.2",
    "bcrypt==4.3.0",
    "ddgs==9.5.5",
    "fastapi==0.116.1",
    "fastapi-limiter==0.1.6",
    "gunicorn==23.0.0",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "jinja2>=3.1.6",
    "langchain==0.3.27",
    "langchain-community==0.3.29",
    "langchain-core==0.3.76",
    "langchain-openai==0.3.33",
    "langgraph==0.6.7",
    "meilisearch==0.38.0",
    "opentelemetry-api==1.40.0",
    "opentelemetry-exporter-otlp-proto-http==1.40.0",
    "opentelemetry-instrumentation-fastapi==0.61b0",
    "opentelemetry-instrumentation-httpx==0.61b0",
    "opentelemetry-instrumentation-sqlalchemy==0.61b0",
    "opentelemetry-sdk==1.40.0",
    "orjson==3.11.3",
    "pandas>=2.3.3",
    "prometheus-client==0.24.1",
    "prometheus-fastapi-instrumentator==7.1.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "pyjwt==2.10.1",
    "pymysql==1.1.1",
    "python-dotenv==1.1.1",
    "redis==6.4.0",
    "requests==2.32.5",
    "sqlalchemy==2.0.43",
    "starlette==0.47.2",
    "uvicorn==0.35.0",
    "wikipedia==1.4.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "W", # pycodestyle warnings
    "I", # isort (import sorting)
]
ignore = [
    "E501", # line-too-long: formatter already enforces 100-char limit where possible
]

[tool.ruff.lint.per-file-ignores]
# Scripts that use sys.path.insert before imports to run standalone
"tests/**" = ["E402"]
"ops/**" = ["E402"]
"evaluation/**" = ["E402"]
"data/**" = ["E402"]
"models/training/**" = ["E402"]
"app/enrichment/**" = ["E402"]
"app/semantic_index/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.9"
typeCheckingMode = "basic"

[tool.pyright.diagnosticSeverityOverrides]
reportLineTooLong = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "respx==0.22.0",
]
