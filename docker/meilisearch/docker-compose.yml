services:
  meilisearch:
    image: getmeili/meilisearch:v1.8  # or latest stable tag
    container_name: meilisearch
    ports:
      - "7700:7700"
    env_file:
      ${BOOKREC_ENV_FILE:?set BOOKREC_ENV_FILE in .env}
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

volumes:
  meili_data:

